<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel de Novedades – Mi credencial Digital</title>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,1&display=block" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Hanken Grotesk', sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); padding: 36px 32px; width: 100%; max-width: 420px; }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .header .material-symbols-outlined { color: #38398a; font-size: 36px; }
    .header h1 { font-size: 20px; font-weight: 700; color: #38398a; }
    .header p { font-size: 13px; color: #666; margin-top: 2px; }
    label { font-size: 13px; font-weight: 600; color: #464651; display: block; margin-bottom: 6px; }
    input[type="password"], textarea { width: 100%; padding: 10px 14px; border: 1.5px solid #d1d5db; border-radius: 8px; font-family: inherit; font-size: 15px; outline: none; transition: border 0.2s; margin-bottom: 18px; }
    input[type="password"]:focus, textarea:focus { border-color: #38398a; }
    textarea { resize: vertical; min-height: 80px; }
    .btn { width: 100%; padding: 13px; border: none; border-radius: 10px; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.2s, transform 0.1s; margin-bottom: 12px; }
    .btn:active { transform: scale(0.97); }
    .btn-publish { background: #38398a; color: #fff; }
    .btn-publish:hover { opacity: 0.88; }
    .btn-disable { background: #d32f2f; color: #fff; border: none; }
    .btn-disable:hover { opacity: 0.88; background: #c62828; }
    .status-box { margin-top: 20px; padding: 14px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; display: none; align-items: center; gap: 10px; }
    .status-box.success { background: #e8f5e9; color: #2e7d32; display: flex; }
    .status-box.error   { background: #fdecea; color: #c62828; display: flex; }
    .status-box.loading { background: #e8eaf6; color: #38398a; display: flex; }
    .divider { border: none; border-top: 1px solid #e0e0e0; margin: 20px 0; }
    .info-box { background: #f0f4ff; border-left: 4px solid #38398a; border-radius: 6px; padding: 12px 14px; font-size: 13px; color: #333; line-height: 1.6; margin-bottom: 20px; }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <span class="material-symbols-outlined">campaign</span>
    <div>
      <h1>Panel de Novedades</h1>
      <p>Mi credencial Digital – Administracion</p>
    </div>
  </div>
  <div class="info-box">
    Al publicar una novedad, todos los afiliados veran un <strong>punto rojo en Novedades</strong> la proxima vez que abran la app o la web.
  </div>
  <label>Contrasena de administrador</label>
  <input type="password" id="admin-key" placeholder="Ingresa la contrasena"/>
  <button class="btn btn-publish" onclick="publicarNovedad()">
    <span class="material-symbols-outlined">send</span>
    Publicar Nueva Novedad
  </button>
  <hr class="divider"/>
  <button class="btn btn-disable" id="btn-desactivar" style="display: none;" onclick="desactivarNotificacion()">
    <span class="material-symbols-outlined">notifications_off</span>
    Desactivar notificacion activa
  </button>
  <div id="status-box" class="status-box">
    <span class="material-symbols-outlined" id="status-icon">info</span>
    <span id="status-msg">...</span>
  </div>
</div>
<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbzMHPDQs7kaEsqj4P31TdV3M7Lch_dWinS1CfiQVytNtvDfnCEwerYQPmASRwzU8qaqUA/exec';

  function mostrarStatus(tipo, icono, msg) {
    const box = document.getElementById('status-box');
    box.className = 'status-box ' + tipo;
    document.getElementById('status-icon').textContent = icono;
    document.getElementById('status-msg').textContent = msg;
  }

  async function checkStatus() {
    try {
      const resp = await fetch(`${API_URL}?action=status`);
      const data = await resp.json();
      if (data.success && data.enabled) {
        document.getElementById('btn-desactivar').style.display = 'flex';
      } else {
        document.getElementById('btn-desactivar').style.display = 'none';
      }
    } catch (e) {
      console.error('Error verificando el estado de la notificacion', e);
    }
  }

  document.addEventListener('DOMContentLoaded', checkStatus);

  async function publicarNovedad() {
    const key = document.getElementById('admin-key').value.trim();
    if (!key) { mostrarStatus('error', 'lock', 'Ingresa la contrasena de administrador.'); return; }
    mostrarStatus('loading', 'hourglass_top', 'Publicando novedad...');
    try {
      const url = `${API_URL}?action=publish&adminKey=${encodeURIComponent(key)}`;
      const resp = await fetch(url);
      const data = await resp.json();
      if (data.success) {
        mostrarStatus('success', 'check_circle', 'Novedad publicada! ID activo: ' + data.newId);
        document.getElementById('btn-desactivar').style.display = 'flex';
      } else {
        mostrarStatus('error', 'error', data.message || 'Error desconocido.');
      }
    } catch (e) {
      mostrarStatus('error', 'wifi_off', 'Error de conexion. Verifica tu internet.');
    }
  }

  async function desactivarNotificacion() {
    const key = document.getElementById('admin-key').value.trim();
    if (!key) { mostrarStatus('error', 'lock', 'Ingresa la contrasena de administrador.'); return; }
    mostrarStatus('loading', 'hourglass_top', 'Desactivando...');
    try {
      const url = `${API_URL}?action=disable&adminKey=${encodeURIComponent(key)}`;
      const resp = await fetch(url);
      const data = await resp.json();
      if (data.success) {
        mostrarStatus('success', 'notifications_off', 'Notificacion desactivada correctamente.');
        document.getElementById('btn-desactivar').style.display = 'none';
      } else {
        mostrarStatus('error', 'error', data.message || 'Error desconocido.');
      }
    } catch (e) {
      mostrarStatus('error', 'wifi_off', 'Error de conexion. Verifica tu internet.');
    }
  }
</script>
</body>
</html>
